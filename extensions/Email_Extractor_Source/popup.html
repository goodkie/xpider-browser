<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Extractor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-background">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
  </div>
  
  <div class="app-container">
    <header class="premium-header">
      <div class="header-main">
        <div class="title-container">
          <img src="icons/icon128.png" id="logoImg" alt="Icon" class="app-icon-large" />
          <div class="text-group">
            <h1 class="main-title">Email</h1>
            <h2 class="sub-title">Extractor <span class="version-tag">v1.0.1</span></h2>
          </div>
        </div>
      </div>
      <p class="subtitle">The World's Fastest Real-time Lead Discovery Engine</p>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="current" data-i18n="tabCurrent">Current</button>
      <button class="tab-btn" data-tab="all" data-i18n="tabAll">All Emails</button>
      <button class="tab-btn" data-tab="settings" data-i18n="tabSettings">Settings</button>
    </nav>

    <main class="tab-contents">
      <!-- Current Page Tab -->
      <section id="current" class="tab-content active">
        <div class="result-header">
          <span data-i18n="emailsFound">Emails found:</span>
          <span class="badge neon" id="pageCount">0</span>
        </div>
        <div class="textarea-wrapper">
          <textarea id="pageEmails" readonly data-i18n-placeholder="noEmailsPage" placeholder="No emails found on this page..."></textarea>
        </div>
        <div class="action-buttons">
          <button class="btn btn-primary" id="btnPageCopy">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7v-1a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1m-4 5H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z"></path></svg>
            <span data-i18n="btnCopy">Copy</span>
          </button>
          <button class="btn btn-secondary" id="btnPageSaveCSV">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"></path></svg>
            <span data-i18n="btnSaveCSV">Save CSV</span>
          </button>
          <button class="btn btn-secondary" id="btnPageSaveTXT">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"></path></svg>
            <span data-i18n="btnSaveTXT">Save TXT</span>
          </button>
          <button class="btn btn-danger" id="btnPageClear">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14zm-9 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m-6 5v6m4-6v6"></path></svg>
            <span data-i18n="btnClear">Clear</span>
          </button>
        </div>
      </section>

      <!-- All Emails Tab -->
      <section id="all" class="tab-content">
         <div class="result-header">
          <span data-i18n="totalCollected">Total collected:</span>
          <span class="badge neon" id="allCount">0</span>
        </div>
        <div class="textarea-wrapper">
          <textarea id="allEmails" readonly data-i18n-placeholder="noEmailsAll" placeholder="No emails accumulated..."></textarea>
        </div>
        <div class="action-buttons">
          <button class="btn btn-primary" id="btnAllCopy">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7v-1a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1m-4 5H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z"></path></svg>
            <span data-i18n="btnCopy">Copy</span>
          </button>
          <button class="btn btn-secondary" id="btnAllSaveCSV">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"></path></svg>
            <span data-i18n="btnSaveCSV">Save CSV</span>
          </button>
          <button class="btn btn-secondary" id="btnAllSaveTXT">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"></path></svg>
            <span data-i18n="btnSaveTXT">Save TXT</span>
          </button>
          <button class="btn btn-danger" id="btnAllClear">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14zm-9 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m-6 5v6m4-6v6"></path></svg>
            <span data-i18n="btnClear">Clear</span>
          </button>
        </div>
      </section>

      <!-- Settings Tab -->
      <section id="settings" class="tab-content">
        <div class="setting-item">
          <div class="setting-info">
            <label for="autosearch" data-i18n="autoSearch">Auto Search</label>
            <p data-i18n="autoSearchDesc">Extract immediately on page load.</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="autosearch" checked />
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <div class="setting-info">
            <label for="collectEmails" data-i18n="keepHistory">Keep History</label>
            <p data-i18n="keepHistoryDesc">Save all parsed emails globally.</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="collectEmails" checked />
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <div class="setting-info">
            <label for="languageSelect" data-i18n="language">Language</label>
          </div>
          <select id="languageSelect" class="lang-select">
            <option value="en">English</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
            <option value="ru">Русский</option>
            <option value="pt">Português</option>
            <option value="it">Italiano</option>
            <option value="ar">العربية</option>
            <option value="hi">हिन्दी</option>
          </select>
        </div>
        
        <!-- Empty space -->
        <div style="flex-grow: 1;"></div>
        
        <div class="about-section">
          <p class="version-text">Email Extractor v1.0.1</p>
        </div>

      </section>
    </main>
  </div>
  
  <div id="toast" class="toast" data-i18n="toastCopied">Copied to clipboard!</div>
  <script src="translations.js"></script>
  <script src="popup.js"></script>
</body>
</html>
