<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LCW SidePanel Fixture</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; background: #0f172a; color: #f8fafc; font-size: 13px; }
    h2 { font-size: 15px; margin: 0 0 10px 0; color: #38bdf8; }
    .badge { display: inline-block; background: #1e293b; padding: 2px 8px; border-radius: 4px; font-weight: 600; color: #a5f3fc; }
    button { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 6px; margin-bottom: 8px; font-size: 12px; }
    button:hover { background: #1d4ed8; }
    pre { background: #020617; border: 1px solid #334155; padding: 8px; border-radius: 4px; font-size: 11px; max-height: 250px; overflow: auto; }
    .section { margin-top: 12px; }
  </style>
</head>
<body>
  <h2>LCW SidePanel <span id="panelId" class="badge">Instance</span></h2>
  <div class="controls">
    <button id="btnCheckContext">Check getContexts()</button>
    <button id="btnQueryTab">Query Active Tab</button>
    <button id="btnPingWorker">Ping Worker</button>
    <button id="btnStorage">Read/Inc Storage</button>
  </div>
  <div class="section">
    <strong>Context Diagnostic:</strong>
    <pre id="diagOutput">Initializing...</pre>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
