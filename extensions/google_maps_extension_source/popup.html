<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMaps Scraper Pro</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="icon" type="image/png" href="icon.png">
  <script src="i18n.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Settings Overlay -->
    <div id="settingsScreen" class="overlay hidden">
      <div class="settings-content">
        <h2 data-i18n="settings_title">Settings</h2>
        <div class="settings-group">
          <label data-i18n="lang_label">Language</label>
          <select id="langSelect">
            <option value="en">English</option>
            <option value="ko">한국어</option>
            <option value="ja">日本語</option>
            <option value="zh_cn">简体中文</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="vi">Tiếng Việt</option>
            <option value="hi">हिन्दी</option>
          </select>
        </div>

        <div class="settings-group">
          <label>🎙️ CAPTCHA Bypass (Wit.ai)</label>
          <div id="witConfig" class="config-subgroup">
            <input type="password" id="witKey" placeholder="Wit.ai Server Access Token" data-i18n-placeholder="label_wit_key">
            <div style="margin-top: 10px; padding: 10px; background: linear-gradient(135deg, rgba(102,126,234,0.08), rgba(118,75,162,0.08)); border-radius: 8px; border-left: 3px solid #667eea;">
              <p style="margin: 0 0 8px 0; font-size: 0.78rem; color: #555; line-height: 1.5;">
                🆓 <strong>무료</strong> Wit.ai API 키를 등록하면 구글 캡차를 자동으로 우회합니다.<br>
                아래 링크에서 앱을 생성 후 <strong>Server Access Token</strong>을 복사하세요.
              </p>
              <a href="https://wit.ai/apps" target="_blank" style="display: inline-block; padding: 7px 16px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: bold; box-shadow: 0 2px 6px rgba(102,126,234,0.4);">
                🔑 Wit.ai 무료 API 키 발급받기 →
              </a>
            </div>
          </div>
        </div>
        <button id="saveConfigBtn" class="btn btn-green" data-i18n="btn_save_config" style="margin-top: 10px;">Save Configuration</button>
        <button id="closeSettingsBtn" class="btn btn-blue" data-i18n="close_btn">Close</button>
      </div>
    </div>
    <header>
      <button id="settingsBtn" class="settings-icon-btn" title="Settings">⚙️</button>
      <div class="logo">
        <img src="icon.png" alt="Logo" class="logo-img">
        <h1>GMaps <span data-i18n="app_subtitle">Scraper Pro</span></h1>
      </div>
      <div class="status-badge" id="botStatus" data-i18n="status_idle">Idle</div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <label data-i18n="leads_found">Total Leads</label>
        <span id="leadCount">0</span>
      </div>
      <div class="stat-card">
        <label data-i18n="emails_found">Emails Found</label>
        <span id="emailCount">0</span>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-blue" data-i18n="btn_start">Start Scraping</button>
      <button id="stopBtn" class="btn btn-red" data-i18n="btn_stop" disabled>Stop</button>
      <button id="clearBtn" class="btn btn-outline-red" data-i18n="btn_clear">Clear Data</button>
    </div>

    <div class="export-section">
      <h3 data-i18n="export_title">Export Data</h3>
      <div class="export-btns">
        <button id="exportCsv" class="btn btn-yellow" data-i18n="export_csv">Export CSV</button>
        <button id="exportJson" class="btn btn-yellow">Export JSON</button>
      </div>
    </div>

    <div class="preview-section">
      <div class="preview-header">
        <h3 data-i18n="recent_leads">Live Preview</h3>
        <span id="resultLabel" data-i18n="nav_desc">Latest results</span>
      </div>
      <div class="table-container">
        <table id="resultsTable">
          <thead>
            <tr>
              <th data-i18n="th_name">Name</th>
              <th data-i18n="th_email">Email</th>
              <th data-i18n="th_phone">Phone</th>
              <th data-i18n="th_website">Website</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rows injected here -->
          </tbody>
        </table>
      </div>
    </div>

    <footer>
      <p data-i18n="footer_text">Full Version Unlocked • Made for GMaps Scraper Pro</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
