name: Build XPIDER Browser

on:
  push:
    tags:
      - 'v*'          # v2.1.6 같은 태그 푸시 시 자동 빌드
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write     # Releases에 파일 업로드 권한

jobs:
  # ──────────────────────────────────────────────────────────
  # Windows 빌드 (.exe + 포터블 ZIP)
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run make:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            out/make/squirrel.windows/x64/XPIDER_Browser_Setup.exe
            out/make/zip/win32/x64/*.zip

  # ──────────────────────────────────────────────────────────
  # macOS 빌드 Intel (.dmg + ZIP)
  # ──────────────────────────────────────────────────────────
  build-macos-x64:
    name: Build macOS (Intel)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Intel
        run: npm run make:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-installers
          path: |
            out/make/*.dmg
            out/make/zip/darwin/x64/*.zip

  # ──────────────────────────────────────────────────────────
  # macOS 빌드 Apple Silicon (.dmg + ZIP)
  # ──────────────────────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Apple Silicon
        run: npm run make:mac-arm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS ARM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-installers
          path: |
            out/make/*.dmg
            out/make/zip/darwin/arm64/*.zip

  # ──────────────────────────────────────────────────────────
  # GitHub Releases에 모든 파일 업로드
  # ──────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "XPIDER Browser ${{ github.ref_name }}"
          body: |
            ## XPIDER Browser ${{ github.ref_name }}

            ### 다운로드
            | 플랫폼 | 파일 | 용도 |
            |--------|------|------|
            | Windows | `XPIDER_Browser_Setup.exe` | 일반 설치 |
            | Windows | `XPIDER Browser-win32-x64-*.zip` | 포터블 (다중 설치) |
            | macOS Intel | `XPIDER Browser-*.dmg` (x64) | DMG 설치 |
            | macOS Silicon | `XPIDER Browser-*.dmg` (arm64) | DMG 설치 |

            ### 다중 설치 방법
            ZIP 파일을 원하는 폴더에 압축 해제 후 `--profile=N` 인수로 실행하세요.
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
