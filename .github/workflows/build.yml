name: Build XPIDER Browser (Portable)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────
  # Windows 포터블 ZIP
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (Portable ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build Windows ZIP
        run: npm run make:win-zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: out/make/zip/win32/x64/*.zip

  # ──────────────────────────────────────────────────────────
  # macOS Intel 포터블 ZIP
  # ──────────────────────────────────────────────────────────
  build-macos-x64:
    name: Build macOS Intel (Portable ZIP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build macOS Intel ZIP
        run: npm run make:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-portable
          path: out/make/zip/darwin/x64/*.zip

  # ──────────────────────────────────────────────────────────
  # macOS Apple Silicon 포터블 ZIP
  # ──────────────────────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS Apple Silicon (Portable ZIP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build macOS ARM64 ZIP
        run: npm run make:mac-arm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-portable
          path: out/make/zip/darwin/arm64/*.zip

  # ──────────────────────────────────────────────────────────
  # GitHub Releases에 포터블 ZIP 업로드
  # ──────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "XPIDER Browser ${{ github.ref_name }} — Portable"
          body: |
            ## XPIDER Browser ${{ github.ref_name }} — 포터블 버전

            ### 📦 다운로드 (ZIP 압축 해제 후 바로 실행)

            | 플랫폼 | 파일명 | 아키텍처 |
            |--------|--------|----------|
            | 🪟 Windows | `XPIDER Browser-win32-x64-*.zip` | Intel/AMD 64bit |
            | 🍎 macOS | `XPIDER Browser-darwin-x64-*.zip` | Intel Mac |
            | 🍎 macOS | `XPIDER Browser-darwin-arm64-*.zip` | Apple Silicon (M1/M2/M3) |

            ### 🚀 다중 설치 방법
            ZIP을 원하는 폴더에 압축 해제 후:
            - **Windows**: `XPIDERBrowser.exe --profile=2` (프로필 번호로 구분)
            - **macOS**: `open "XPIDER Browser.app" --args --profile=2`

            ### ✅ 변경 사항
            - 앱 시작 시 스플래시 화면 표시 (투명 배경 + 로고 애니메이션)
            - 브라우저 실행 후 익스텐션 자동 업데이트 (버전 비교)
            - 새 익스텐션 자동 설치 및 사이드바 자동 갱신
          files: dist/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
