name: Build XPIDER Browser (Portable)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────
  # Windows 포터블 ZIP + SFX Setup
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (Portable ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # SFX C# 프로젝트 빌드를 위한 .NET SDK 설치
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - name: Build Windows ZIP
        run: npm run make:win-zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename Windows ZIP
        shell: bash
        run: mv out/make/zip/win32/x64/*.zip "out/make/zip/win32/x64/XPIDER-Browser-Windows-${{ github.ref_name }}.zip"
      - name: Build Windows SFX (Auto-Extractor)
        shell: powershell
        run: powershell src\\deploy\\build-sfx.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            out/make/**/*.zip
            out/make/**/*.exe
          retention-days: 1



  # ──────────────────────────────────────────────────────────
  # macOS Intel 포터블 ZIP
  # ──────────────────────────────────────────────────────────
  build-macos-x64:
    name: Build macOS Intel (Portable ZIP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build macOS Intel DMG
        run: npm run make:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename Mac Intel DMG
        run: |
          mkdir -p out/make/dmg/x64
          find out/make -name "*.dmg" -exec mv {} "out/make/dmg/x64/XPIDER-Browser-Mac-Intel-${{ github.ref_name }}.dmg" \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-dmg
          path: out/make/**/*.dmg
          retention-days: 1


  # ──────────────────────────────────────────────────────────
  # macOS Apple Silicon 포터블 ZIP
  # ──────────────────────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS Apple Silicon (Portable ZIP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build macOS ARM64 DMG
        run: npm run make:mac-arm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename Mac Arm DMG
        run: |
          mkdir -p out/make/dmg/arm64
          find out/make -name "*.dmg" -exec mv {} "out/make/dmg/arm64/XPIDER-Browser-Mac-Arm-${{ github.ref_name }}.dmg" \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: out/make/**/*.dmg
          retention-days: 1


  # ──────────────────────────────────────────────────────────
  # GitHub Releases에 파일 업로드
  # ──────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "XPIDER Browser ${{ github.ref_name }}"
          body: |
            ## XPIDER Browser ${{ github.ref_name }}

            ### 📦 Download Links

            | Platform | File | Type |
            |----------|------|------|
            | 🪟 Windows | `XPIDER-Browser-Windows-${{ github.ref_name }}-Setup.exe` | Auto-Extractor (SFX) & Shortcut |
            | 🪟 Windows | `XPIDER-Browser-Windows-${{ github.ref_name }}.zip` | Portable (Zip) |
            | 🍎 macOS | `XPIDER-Browser-Mac-Intel-${{ github.ref_name }}.dmg` | Intel Mac (DMG) |
            | 🍎 macOS | `XPIDER-Browser-Mac-Arm-${{ github.ref_name }}.dmg` | Apple Silicon (DMG) |

            ### 🚀 Instructions
            - **Windows (Auto-Extractor)**: Run `...-Setup.exe` to extract to a chosen folder and optionally create a desktop shortcut.
            - **Windows (Portable)**: Extract `.zip` to any folder. Each folder keeps its own login info.
            - **macOS**: Open `.dmg` and drag XPIDER to the Applications folder.

            ### 📂 Portable Isolation
            Login sessions and settings are stored in the `data/` folder inside your browser directory.
          files: |
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
