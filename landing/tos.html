<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPIDER Browser | Terms of Service</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Marked Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-dark: #03001e;
      --bg-mid: #0b0728;
      --bg-light: #0f0c24;
      --color-primary: #2563eb;
      --color-primary-glow: rgba(37, 99, 235, 0.45);
      --color-cyan: #06b6d4;
      --color-cyan-glow: rgba(6, 182, 212, 0.4);
      --color-purple: #7c3aed;
      --color-purple-glow: rgba(124, 58, 237, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --glass-surface: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-border-hover: rgba(255, 255, 255, 0.15);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition-base: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient background light orbs */
    .bg-glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }

    .orb-1 {
      top: -10%;
      left: 15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--color-primary-glow) 0%, transparent 70%);
    }

    .orb-2 {
      bottom: -10%;
      right: 10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--color-purple-glow) 0%, transparent 70%);
    }

    header {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      z-index: 100;
      background: rgba(3, 0, 30, 0.7);
      padding: 16px 0;
      position: sticky;
      top: 0;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--color-primary), var(--color-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 0 15px var(--color-primary-glow);
    }

    .logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #fff, var(--color-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .actions-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    select.lang-selector {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: var(--transition-base);
    }

    select.lang-selector:hover {
      border-color: var(--glass-border-hover);
      background: rgba(255, 255, 255, 0.1);
    }

    select.lang-selector option {
      background: var(--bg-mid);
      color: var(--text-main);
    }

    .btn-action {
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition-base);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-edit {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
    }

    .btn-edit:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--glass-border-hover);
    }

    .btn-save {
      background: linear-gradient(135deg, var(--color-primary), var(--color-purple));
      color: #fff;
      box-shadow: 0 4px 15px var(--color-primary-glow);
    }

    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--color-primary-glow);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 40px auto;
      padding: 0 24px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .tos-container {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255,255,255,0.05);
      min-height: 500px;
      transition: var(--transition-base);
      position: relative;
    }

    .editor-layout {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      width: 100%;
    }

    .editor-pane, .preview-pane {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pane-header {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--color-cyan);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea.tos-textarea {
      width: 100%;
      height: 500px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: #e2e8f0;
      padding: 20px;
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.7;
      resize: none;
      outline: none;
      transition: var(--transition-base);
    }

    textarea.tos-textarea:focus {
      border-color: var(--color-cyan);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
    }

    .preview-render, .static-view {
      padding: 10px 0;
      color: #e2e8f0;
    }

    /* Beautiful markdown rendering styles */
    .preview-render h1, .static-view h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 24px;
      background: linear-gradient(90deg, #fff, var(--color-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .preview-render h2, .static-view h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-top: 28px;
      margin-bottom: 16px;
      color: #f8fafc;
    }

    .preview-render p, .static-view p {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.8;
    }

    .preview-render ul, .static-view ul {
      margin-left: 20px;
      margin-bottom: 18px;
      color: var(--text-muted);
    }

    .preview-render li, .static-view li {
      margin-bottom: 8px;
      font-size: 15px;
    }

    .preview-render strong, .static-view strong {
      color: #fff;
    }

    .preview-render hr, .static-view hr {
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 30px 0;
    }

    .preview-render em, .static-view em {
      color: var(--color-cyan);
      font-style: italic;
    }

    .status-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(13, 13, 13, 0.95);
      border: 1px solid var(--color-cyan);
      border-radius: var(--radius-md);
      padding: 16px 24px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: var(--transition-base);
      z-index: 1000;
      font-weight: 500;
    }

    .status-toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .status-toast.success {
      border-color: #10b981;
    }

    .status-toast.error {
      border-color: #ef4444;
    }

    footer {
      border-top: 1px solid var(--glass-border);
      padding: 24px 0;
      text-align: center;
      font-size: 13px;
      color: var(--text-dim);
      background: rgba(3, 0, 30, 0.5);
      margin-top: auto;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Glow effects -->
  <div class="bg-glow-orb orb-1"></div>
  <div class="bg-glow-orb orb-2"></div>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo-area">
        <div class="logo-icon">X</div>
        <span class="logo-text">XPIDER</span>
      </a>
      <div class="actions-area">
        <select id="langSelector" class="lang-selector">
          <option value="en">English (US)</option>
          <option value="ko" selected>한국어 (Korean)</option>
          <option value="ja">日本語 (Japanese)</option>
          <option value="zh">中文 (Chinese)</option>
          <option value="es">Español (Spanish)</option>
          <option value="fr">Français (French)</option>
          <option value="de">Deutsch (German)</option>
          <option value="ru">Русский (Russian)</option>
          <option value="pt">Português (Portuguese)</option>
          <option value="ar">العربية (Arabic)</option>
          <option value="hi">हिन्दी (Hindi)</option>
          <option value="it">Italiano (Italian)</option>
        </select>
        <button id="btnToggleEdit" class="btn-action btn-edit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"></path>
          </svg>
          Edit Terms
        </button>
        <button id="btnSave" class="btn-action btn-save" style="display: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Save Changes
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="tosCard" class="tos-container">
      <!-- Static View -->
      <div id="staticLayout" class="static-view">
        Loading Terms of Service...
      </div>

      <!-- Editor Layout -->
      <div id="editorLayout" class="editor-layout">
        <div class="editor-pane">
          <div class="pane-header">
            <span>Markdown Editor</span>
          </div>
          <textarea id="tosTextarea" class="tos-textarea"></textarea>
        </div>
        <div class="preview-pane">
          <div class="pane-header">
            <span>Live Preview</span>
          </div>
          <div id="previewRender" class="preview-render"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Status Toast -->
  <div id="statusToast" class="status-toast">
    <span id="toastIcon">ℹ️</span>
    <span id="toastMessage">Message</span>
  </div>

  <footer>
    &copy; 2026 XPIDER. All rights reserved. Premium Automations & Security Solutions.
  </footer>

  <script>
    const langSelector = document.getElementById('langSelector');
    const btnToggleEdit = document.getElementById('btnToggleEdit');
    const btnSave = document.getElementById('btnSave');
    const staticLayout = document.getElementById('staticLayout');
    const editorLayout = document.getElementById('editorLayout');
    const tosTextarea = document.getElementById('tosTextarea');
    const previewRender = document.getElementById('previewRender');
    const statusToast = document.getElementById('statusToast');
    const toastMessage = document.getElementById('toastMessage');
    const toastIcon = document.getElementById('toastIcon');

    let currentLang = 'ko';
    let isEditing = false;
    let originalContent = '';

    // Extract language from URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const queryLang = urlParams.get('lang');
    if (queryLang && Array.from(langSelector.options).some(opt => opt.value === queryLang)) {
      currentLang = queryLang;
      langSelector.value = queryLang;
    }

    // Load TOS Content
    async function loadTOS(lang) {
      currentLang = lang;
      staticLayout.innerHTML = '<p style="color: var(--text-muted);">Loading Terms of Service...</p>';
      
      try {
        // Try to fetch from the local deploy server first
        const localRes = await fetch(`http://localhost:9987/api/get-tos?lang=${lang}`).catch(() => null);
        if (localRes && localRes.ok) {
          const data = await localRes.json();
          renderContent(data.content || getDefaultTOS(lang));
          return;
        }

        // Fallback to GitHub raw files
        const githubRes = await fetch(`https://raw.githubusercontent.com/goodkie/xpider-browser/main/TOS_${lang}.md`);
        if (githubRes.ok) {
          const text = await githubRes.text();
          renderContent(text);
        } else {
          renderContent(getDefaultTOS(lang));
        }
      } catch (e) {
        renderContent(getDefaultTOS(lang));
      }
    }

    function renderContent(content) {
      originalContent = content;
      tosTextarea.value = content;
      staticLayout.innerHTML = marked.parse(content);
      previewRender.innerHTML = marked.parse(content);
    }

    // Default Fallbacks
    function getDefaultTOS(lang) {
      if (lang === 'ko') {
        return `# 이용 약관 (한국어)\n\n**XPIDER Browser**에 오신 것을 환영합니다.\n\n본 약관은 XPIDER Browser의 사용과 관련된 귀하와 개발자 간의 권리, 의무 및 책임 사항을 규정합니다.\n\n## 1. 수집하는 정보\n본 브라우저는 원활한 웹 서핑 경험을 제공하기 위해 필요한 최소한의 로컬 데이터만을 저장합니다.\n\n## 2. 사용자의 의무\n사용자는 본 브라우저를 불법적인 목적이나 타인에게 피해를 주는 방식으로 사용해서는 안 됩니다.\n\n## 3. 책임의 한계\n개발자는 브라우저 사용으로 인해 발생하는 직접적 또는 간접적인 피해에 대해 법적 책임을 지지 않습니다.`;
      }
      return `# Terms of Service (${lang.toUpperCase()})\n\nWelcome to **XPIDER Browser**.\n\nThese terms govern your use of the XPIDER Browser and define the rights and obligations between you and the developer.\n\n## 1. Data Collection\nThis browser only stores minimal local data on your device to ensure a smooth web experience.\n\n## 2. User Responsibility\nYou agree not to use the browser for any illegal activities or in a way that harms others.\n\n## 3. Limitation of Liability\nThe developer is not legally liable for any direct or indirect damages arising from the use of the browser.`;
    }

    // Show custom toast message
    function showToast(message, type = 'info') {
      toastMessage.textContent = message;
      statusToast.className = 'status-toast show ' + type;
      if (type === 'success') toastIcon.textContent = '✅';
      else if (type === 'error') toastIcon.textContent = '❌';
      else toastIcon.textContent = 'ℹ️';

      setTimeout(() => {
        statusToast.classList.remove('show');
      }, 4000);
    }

    // Toggle Edit Mode
    btnToggleEdit.addEventListener('click', () => {
      isEditing = !isEditing;
      if (isEditing) {
        staticLayout.style.display = 'none';
        editorLayout.style.display = 'grid';
        btnSave.style.display = 'inline-flex';
        btnToggleEdit.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Cancel
        `;
        btnToggleEdit.className = 'btn-action btn-edit';
      } else {
        staticLayout.style.display = 'block';
        editorLayout.style.display = 'none';
        btnSave.style.display = 'none';
        btnToggleEdit.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"></path>
          </svg>
          Edit Terms
        `;
        // Restore original content
        tosTextarea.value = originalContent;
        previewRender.innerHTML = marked.parse(originalContent);
      }
    });

    // Real-time Preview Rendering
    tosTextarea.addEventListener('input', () => {
      previewRender.innerHTML = marked.parse(tosTextarea.value);
    });

    // Save Changes
    btnSave.addEventListener('click', async () => {
      const content = tosTextarea.value;
      
      try {
        // Try local backend first (for developers running XPIDER Deploy Center locally)
        const response = await fetch('http://localhost:9987/api/edit-tos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, lang: currentLang })
        });

        if (response.ok) {
          originalContent = content;
          renderContent(content);
          showToast('Terms of Service successfully updated & committed locally!', 'success');
          // Automatically click cancel/toggle edit off
          btnToggleEdit.click();
        } else {
          throw new Error('Local server failed to save');
        }
      } catch (e) {
        // If local save fails, download as file and let user know how to update
        const blob = new Blob([content], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `TOS_${currentLang}.md`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('Local server offline. TOS markdown file downloaded to apply manually.', 'info');
      }
    });

    // Language selector change handler
    langSelector.addEventListener('change', (e) => {
      loadTOS(e.target.value);
      // Turn off editing mode when switching languages
      if (isEditing) {
        btnToggleEdit.click();
      }
    });

    // Initial Load
    loadTOS(currentLang);
  </script>
</body>
</html>
