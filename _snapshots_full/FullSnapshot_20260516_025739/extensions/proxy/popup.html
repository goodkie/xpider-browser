<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPIDER VPN</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient Background Orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <div class="app-container">
    <header>
      <div class="logo">
        <h1>XPIDER <span>VPN</span></h1>
        <p class="tagline" id="tagline">Military-Grade Encryption Protocol</p>
      </div>
      <button id="settings-trigger" class="icon-btn glass-panel">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </header>

    <main>
      <div class="status-header">
        <div id="connection-status" class="status-badge">Disconnected</div>
      </div>
      
      <div class="stats-grid">
        <div class="stat-card glass-panel">
          <div class="stat-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          </div>
          <div class="stat-info">
            <span class="label" id="label-ip">Proxy IP</span>
            <span id="current-ip" class="value font-mono">— — — —</span>
          </div>
        </div>
        <div class="stat-card glass-panel">
          <div class="stat-icon loc-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
          </div>
          <div class="stat-info">
            <span class="label" id="label-loc">Location</span>
            <span id="current-location" class="value">None</span>
          </div>
        </div>
      </div>

      <div class="power-button-container">
        <!-- 3D button structure -->
        <button id="connect-btn" class="power-btn">
          <div class="btn-ripple"></div>
          <div class="btn-shadow"></div>
          <div class="btn-outer">
            <div class="btn-inner">
              <svg viewBox="0 0 24 24">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" y1="2" x2="12" y2="12"></line>
              </svg>
            </div>
          </div>
        </button>
        <div class="action-hint-container">
          <div class="hint-dot"></div>
          <p id="action-hint">Ready to Connect</p>
        </div>
      </div>

      <div class="server-selector glass-panel" id="server-list-trigger">
        <div class="selector-left">
          <div class="flag-placeholder"></div>
          <div class="selector-info">
            <label id="label-server">Current Server</label>
            <span id="selected-server-name">Optimal Location</span>
          </div>
        </div>
        <div class="selector-right">
          <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
    </main>

    <!-- Server Modal -->
    <div id="server-modal" class="modal">
      <div class="modal-content glass-modal">
        <div class="modal-header">
          <h2 id="modal-title-server">Select Location</h2>
          <button id="close-modal" class="icon-btn modal-close">&times;</button>
        </div>
        <div id="server-list" class="server-list">
          <!-- servers -->
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-panel" class="modal">
      <div class="modal-content glass-modal">
        <div class="modal-header">
          <h2 id="modal-title-set">System Configuration</h2>
          <button id="close-settings" class="icon-btn modal-close">&times;</button>
        </div>
        <div class="settings-body">
          <div class="settings-section">
            <div class="section-title">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
              <label id="label-lang">Language Preference</label>
            </div>
            <div class="lang-grid" id="lang-grid">
              <!-- 12 languages -->
            </div>
          </div>
          <div class="app-version">
            XPIDER ENGINE PRO v3.0
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
