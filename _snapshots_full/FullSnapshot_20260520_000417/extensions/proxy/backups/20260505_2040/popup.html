<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity VPN</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="logo">
        <span class="logo-icon">🛡️</span>
        <h1>Antigravity <span>VPN</span></h1>
      </div>
    </header>

    <main>
      <div class="status-panel">
        <div id="connection-status" class="status-badge disconnected">Disconnected</div>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="label">Proxy IP</span>
            <span id="current-ip" class="value">— — — —</span>
          </div>
          <div class="stat-item">
            <span class="label">Location</span>
            <span id="current-location" class="value">None</span>
          </div>
        </div>
      </div>

      <div class="power-button-container">
        <button id="connect-btn" class="power-btn">
          <div class="power-inner">
            <span id="power-icon">⏻</span>
          </div>
          <div class="glow"></div>
        </button>
        <p id="action-hint">Tap to Connect</p>
      </div>

      <div class="server-selector">
        <label>Server</label>
        <div id="server-list-trigger" class="selector-trigger">
          <span id="selected-server-name">Auto Select</span>
          <span class="chevron">▼</span>
        </div>
      </div>
    </main>

    <footer>
      <div id="debug-log" style="font-size:0.58rem;color:#555;max-height:60px;overflow-y:auto;line-height:1.6;"></div>
    </footer>

    <!-- Server Modal -->
    <div id="server-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Select Location</h2>
          <button id="close-modal" class="close-btn">&times;</button>
        </div>
        <div id="server-list" class="server-list">
          <div class="loading">Loading servers…</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
