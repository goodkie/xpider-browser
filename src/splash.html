<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>XPIDER</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      width: 320px;
      height: 320px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, 'Inter', sans-serif;
    }

    .wrap {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── 링 ── */
    .ring {
      position: absolute;
      border-radius: 50%;
      border-style: solid;
      border-color: transparent;
    }
    .r1 {
      width: 250px; height: 250px;
      border-width: 2.5px;
      border-top-color: rgba(0,229,255,0.95);
      border-right-color: rgba(0,229,255,0.15);
      animation: cw 1.1s linear infinite;
      filter: drop-shadow(0 0 7px rgba(0,229,255,0.7));
    }
    .r2 {
      width: 218px; height: 218px;
      border-width: 2px;
      border-bottom-color: rgba(123,97,255,0.9);
      border-left-color: rgba(123,97,255,0.12);
      animation: ccw 1.7s linear infinite;
      filter: drop-shadow(0 0 5px rgba(123,97,255,0.6));
    }
    .r3 {
      width: 186px; height: 186px;
      border-width: 1.5px;
      border-top-color: rgba(0,229,255,0.4);
      border-style: dashed;
      animation: cw 3s linear infinite;
    }
    .r4 {
      width: 154px; height: 154px;
      border-width: 1px;
      border-bottom-color: rgba(123,97,255,0.3);
      border-style: dashed;
      animation: ccw 4s linear infinite;
    }

    /* ── 중앙 로고 ── */
    .center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }
    .logo {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      object-fit: contain;
      filter: drop-shadow(0 0 14px rgba(0,229,255,0.55));
      animation: pulse 2.4s ease-in-out infinite;
    }
    .name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0,229,255,0.75);
    }
    .sub {
      font-size: 8.5px;
      letter-spacing: 2.5px;
      color: rgba(255,255,255,0.38);
      text-transform: uppercase;
      animation: fade 2.4s ease-in-out infinite;
    }

    /* ── 진행 텍스트 (스플래시 하단) ── */
    .status {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      transition: opacity 0.25s ease;
    }

    @keyframes cw   { to { transform: rotate(360deg);  } }
    @keyframes ccw  { to { transform: rotate(-360deg); } }
    @keyframes pulse {
      0%,100% { transform:scale(1);    filter:drop-shadow(0 0 14px rgba(0,229,255,0.55)); }
      50%      { transform:scale(1.05);filter:drop-shadow(0 0 22px rgba(0,229,255,0.85)); }
    }
    @keyframes fade {
      0%,100% { opacity:0.38; }
      50%      { opacity:0.75; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="center">
      <img class="logo" src="assets/icon.png" alt="X"
           onerror="this.style.display='none'">
      <span class="name">XPIDER</span>
      <span class="sub">Loading...</span>
    </div>
    <div class="status" id="status-text"></div>
  </div>

  <script>
    if (window.splashAPI) {
      window.splashAPI.onProgress(msg => {
        const el = document.getElementById('status-text');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(() => { el.textContent = msg; el.style.opacity = '1'; }, 180);
      });
      window.splashAPI.onVersion(ver => {
        const s = document.querySelector('.sub');
        if (s) s.textContent = 'v' + ver;
      });
    }
  </script>
</body>
</html>
