<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPIDER</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      height: 320px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .splash-root {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── 바깥 원형 링 (빠른 회전) ── */
    .ring-outer {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #00e5ff;
      border-right-color: #00e5ff44;
      animation: spin-cw 1.1s linear infinite;
      filter: drop-shadow(0 0 8px #00e5ff88);
    }

    /* ── 중간 원형 링 (반대 방향) ── */
    .ring-mid {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #7b61ff;
      border-left-color: #7b61ff44;
      animation: spin-ccw 1.6s linear infinite;
      filter: drop-shadow(0 0 6px #7b61ff88);
    }

    /* ── 안쪽 점선 링 ── */
    .ring-inner {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1.5px dashed rgba(0, 229, 255, 0.3);
      animation: spin-cw 3s linear infinite;
    }

    /* ── 중앙 로고 영역 ── */
    .logo-center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.6));
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff;
      text-transform: uppercase;
      opacity: 0.9;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
    }

    .logo-sub {
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      animation: fadeInOut 2s ease-in-out infinite;
    }

    /* ── 글로우 배경 효과 ── */
    .glow-bg {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,255,0.08) 0%, transparent 70%);
      animation: glowPulse 2s ease-in-out infinite;
    }

    /* ── 애니메이션 ── */
    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes spin-ccw {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%       { transform: scale(1.05); opacity: 0.85; }
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.8; }
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1);   opacity: 0.5; }
      50%       { transform: scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash-root">
    <div class="glow-bg"></div>
    <div class="ring-outer"></div>
    <div class="ring-mid"></div>
    <div class="ring-inner"></div>
    <div class="logo-center">
      <img class="logo-icon" src="assets/icon.png" alt="XPIDER"
           onerror="this.style.opacity='0'">
      <span class="logo-text">XPIDER</span>
      <span class="logo-sub">Loading...</span>
    </div>
  </div>
</body>
</html>
