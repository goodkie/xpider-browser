<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPIDER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 460px;
      height: 540px;
      background: #080c18;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      border-radius: 16px;
    }

    /* ── 배경 그라디언트 글로우 ── */
    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(0, 229, 255, 0.06) 0%,
        rgba(123, 97, 255, 0.04) 40%,
        transparent 70%);
      animation: bgPulse 3s ease-in-out infinite;
    }
    .bg-glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle,
        transparent 40%,
        rgba(0, 229, 255, 0.02) 70%,
        transparent 100%);
      animation: bgPulse 4s ease-in-out infinite reverse;
    }

    /* ── 로딩 링 컨테이너 ── */
    .spinner-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── 링들 ── */
    .ring {
      position: absolute;
      border-radius: 50%;
      border-style: solid;
      border-color: transparent;
    }
    .ring-1 {
      width: 196px; height: 196px;
      border-width: 2.5px;
      border-top-color: rgba(0, 229, 255, 0.9);
      border-right-color: rgba(0, 229, 255, 0.2);
      animation: spinCW 1.2s linear infinite;
      filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.7));
    }
    .ring-2 {
      width: 170px; height: 170px;
      border-width: 2px;
      border-bottom-color: rgba(123, 97, 255, 0.9);
      border-left-color: rgba(123, 97, 255, 0.2);
      animation: spinCCW 1.8s linear infinite;
      filter: drop-shadow(0 0 5px rgba(123, 97, 255, 0.7));
    }
    .ring-3 {
      width: 144px; height: 144px;
      border-width: 1.5px;
      border-top-color: rgba(0, 229, 255, 0.4);
      border-right-color: rgba(0, 229, 255, 0.1);
      border-style: dashed;
      animation: spinCW 3s linear infinite;
    }
    .ring-4 {
      width: 118px; height: 118px;
      border-width: 1px;
      border-bottom-color: rgba(123, 97, 255, 0.3);
      border-style: dashed;
      animation: spinCCW 4s linear infinite;
    }

    /* ── 중앙 로고 ── */
    .logo-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .logo-img {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.5));
      animation: logoPulse 2.5s ease-in-out infinite;
    }

    /* ── 브랜드 텍스트 ── */
    .brand {
      margin-top: 20px;
      text-align: center;
      z-index: 10;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
    }
    .brand-sub {
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── 진행 메시지 영역 ── */
    .progress-wrap {
      margin-top: 32px;
      width: 340px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* 진행 바 */
    .progress-track {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00e5ff, #7b61ff);
      border-radius: 2px;
      animation: progressAnim 2s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
    }

    /* 메시지 텍스트 */
    .progress-text {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.5px;
      text-align: center;
      min-height: 16px;
      transition: opacity 0.3s ease;
    }

    /* ── 버전 ── */
    .version-text {
      position: absolute;
      bottom: 18px;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 1px;
    }

    /* ── 파티클 점들 ── */
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.6);
      animation: particleFloat linear infinite;
    }

    /* ── 애니메이션 ── */
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 16px rgba(0,229,255,0.5)); }
      50%       { transform: scale(1.04); filter: drop-shadow(0 0 24px rgba(0,229,255,0.8)); }
    }
    @keyframes bgPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.1); }
    }
    @keyframes progressAnim {
      0%   { width: 5%;   opacity: 0.8; }
      50%  { width: 85%;  opacity: 1; }
      100% { width: 5%;   opacity: 0.8; }
    }
    @keyframes particleFloat {
      0%   { opacity: 0;   transform: translateY(0)    scale(1); }
      20%  { opacity: 0.8; }
      80%  { opacity: 0.4; }
      100% { opacity: 0;   transform: translateY(-80px) scale(0.3); }
    }
  </style>
</head>
<body>
  <!-- 배경 글로우 -->
  <div class="bg-glow-2"></div>
  <div class="bg-glow"></div>

  <!-- 파티클들 -->
  <div class="particle" style="left:60px;  top:380px; animation-duration:3.1s; animation-delay:0s;    background:rgba(0,229,255,0.7);"></div>
  <div class="particle" style="left:110px; top:420px; animation-duration:2.8s; animation-delay:0.5s;  background:rgba(123,97,255,0.7);"></div>
  <div class="particle" style="left:340px; top:400px; animation-duration:3.5s; animation-delay:1s;    background:rgba(0,229,255,0.5);"></div>
  <div class="particle" style="left:380px; top:360px; animation-duration:2.6s; animation-delay:1.5s;  background:rgba(123,97,255,0.5);"></div>
  <div class="particle" style="left:200px; top:440px; animation-duration:3.2s; animation-delay:0.8s;  background:rgba(0,229,255,0.6);"></div>

  <!-- 스피너 + 로고 -->
  <div class="spinner-wrap">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="ring ring-4"></div>
    <div class="logo-wrap">
      <img class="logo-img" src="assets/icon.png" alt="XPIDER" onerror="this.style.display='none'">
    </div>
  </div>

  <!-- 브랜드 -->
  <div class="brand">
    <div class="brand-name">XPIDER</div>
    <div class="brand-sub">Smart Browser</div>
  </div>

  <!-- 진행 상황 -->
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-bar" id="prog-bar"></div>
    </div>
    <div class="progress-text" id="progress-text">초기화 중...</div>
  </div>

  <!-- 버전 -->
  <div class="version-text" id="version-label">v3.0.4</div>

  <script>
    // IPC로 진행 메시지를 수신하여 표시
    if (window.splashAPI) {
      window.splashAPI.onProgress((msg) => {
        const el = document.getElementById('progress-text');
        if (el) {
          el.style.opacity = '0';
          setTimeout(() => {
            el.textContent = msg;
            el.style.opacity = '1';
          }, 150);
        }
      });
      window.splashAPI.onVersion((ver) => {
        const el = document.getElementById('version-label');
        if (el) el.textContent = 'v' + ver;
      });
    }
  </script>
</body>
</html>
