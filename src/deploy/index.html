<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>XPIDER Deploy Center</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0d0d18;
  --surface: rgba(255,255,255,0.04);
  --surface2: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --accent: #7c3aed;
  --accent-lite: #9d60ff;
  --accent-glow: rgba(124,58,237,0.4);
  --cyan: #06b6d4;
  --green: #10b981;
  --red: #ef4444;
  --yellow: #f59e0b;
  --text: #e2e8f0;
  --dim: #64748b;
  --muted: #334155;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100vh; overflow:hidden; font-family:'Inter',system-ui,sans-serif; color:var(--text); background:var(--bg); }
body {
  display:grid; grid-template-rows:52px 1fr 200px;
  background-image:
    radial-gradient(ellipse at 15% 0%, rgba(124,58,237,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 100%, rgba(6,182,212,0.07) 0%, transparent 50%);
}

/* ── 헤더 ── */
header {
  display:flex; align-items:center; gap:14px; padding:0 22px;
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.logo {
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;color:#fff;
  box-shadow:0 0 16px var(--accent-glow);
}
.brand { font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--accent-lite),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent; }
.hflex { margin-left:auto;display:flex;align-items:center;gap:10px; }
.sdot { width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);transition:.3s; }
.sdot.busy { background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:pulse 1s infinite; }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stext { font-size:11px;color:var(--dim); }
.hbtn {
  background:var(--surface);border:1px solid var(--border);color:var(--dim);
  padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;
  transition:.2s;font-family:inherit;
}
.hbtn:hover { background:var(--surface2);color:var(--text); }

/* ── 콘텐츠 ── */
.content { display:grid;grid-template-columns:340px 1fr;overflow:hidden; }
.panel { padding:20px;overflow-y:auto;border-right:1px solid var(--border); }
.panel:last-child{border-right:none;}
::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:var(--muted);border-radius:4px;}

.ptitle {
  font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--dim);margin-bottom:14px;display:flex;align-items:center;gap:7px;
}

/* ── 앱 버전 카드 ── */
.ver-card {
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:18px;margin-bottom:14px;
}
.vlabel{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.vnum {
  font-size:38px;font-weight:900;letter-spacing:-2px;
  background:linear-gradient(90deg,#fff,var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:10px;
}
.vmeta{display:flex;gap:8px;flex-wrap:wrap;}
.chip {
  display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  padding:3px 10px;border-radius:20px;
}
.chip-green { color:var(--green);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.06); }
.chip-red   { color:var(--red);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.06); }
.chip-accent{ color:var(--accent-lite);border-color:rgba(124,58,237,.3);background:rgba(124,58,237,.08); }

/* ── 버튼 ── */
.btns { display:flex;flex-direction:column;gap:8px;margin-bottom:14px; }
.btn {
  padding:11px 16px;border:none;border-radius:var(--r-md);
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;gap:10px;text-align:left;
  width:100%;
}
.bico{font-size:16px;} .btxt{flex:1;} .bsub{font-size:10px;opacity:.6;font-weight:400;}
.btn-prim {
  background:linear-gradient(135deg,var(--accent),var(--accent-lite));
  color:#fff;box-shadow:0 4px 18px var(--accent-glow);
}
.btn-prim:hover{transform:translateY(-2px);box-shadow:0 8px 28px var(--accent-glow);}
.btn-sec  { background:var(--surface);color:var(--text);border:1px solid var(--border); }
.btn-sec:hover{background:var(--surface2);}
.btn-cyan { background:rgba(6,182,212,.1);color:var(--cyan);border:1px solid rgba(6,182,212,.25); }
.btn-cyan:hover{background:rgba(6,182,212,.18);}
.btn-red  { background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25); }
.btn-red:hover{background:rgba(239,68,68,.18);}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important;}

.divider{height:1px;background:var(--border);margin:12px 0;}

/* 커스텀 버전 입력 */
.custom-ver {
  display:flex;gap:8px;align-items:center;
}
.ver-input {
  flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-family:'JetBrains Mono',monospace;
  font-size:13px;padding:10px 12px;outline:none;transition:border-color .2s;
}
.ver-input:focus{border-color:var(--accent);}
.ver-input::placeholder{color:var(--dim);}

/* ── 익스텐션 ── */
.ext-card {
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:16px;margin-bottom:10px;transition:.2s;
}
.ext-card:hover{border-color:rgba(124,58,237,.35);}
.ext-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.ext-name{font-size:14px;font-weight:700;}
.ext-ver{
  font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;
  background:rgba(124,58,237,.15);color:var(--accent-lite);
  border:1px solid rgba(124,58,237,.3);
}
.ext-row{display:flex;gap:8px;align-items:center;}
.ext-inp {
  flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-family:'JetBrains Mono',monospace;
  font-size:12px;padding:7px 10px;outline:none;transition:.2s;
}
.ext-inp:focus{border-color:var(--accent);}
.ext-actions{display:flex;gap:6px;}
.ext-actions .btn{padding:7px 12px;font-size:11px;}

/* ── 콘솔 ── */
.console-wrap{border-top:1px solid var(--border);display:flex;flex-direction:column;background:rgba(0,0,0,.5);}
.console-bar{
  height:34px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.console-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px;}
.console-acts{display:flex;gap:6px;}
.cbtn{background:none;border:1px solid var(--border);color:var(--dim);padding:2px 10px;border-radius:5px;font-size:10px;cursor:pointer;font-family:inherit;transition:.2s;}
.cbtn:hover{background:var(--surface2);color:var(--text);}
.console-log{
  flex:1;overflow-y:auto;padding:10px 16px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;
}
.log-line{white-space:pre-wrap;word-break:break-all;}
.log-ok {color:#4ade80;}
.log-err{color:#f87171;}
.log-cmd{color:var(--cyan);}
.log-info{color:var(--accent-lite);}
</style>
</head>
<body>

<!-- 헤더 -->
<header>
  <div class="logo">X</div>
  <span class="brand">Deploy Center</span>
  <div class="hflex">
    <div class="sdot" id="sdot"></div>
    <span class="stext" id="stext">준비됨</span>
    <button class="hbtn" onclick="openActions()">🔗 GitHub Actions</button>
    <button class="hbtn" onclick="loadInfo()">↻ 새로고침</button>
  </div>
</header>

<!-- 콘텐츠 -->
<div class="content">
  <!-- 왼쪽: 앱 배포 -->
  <div class="panel">
    <div class="ptitle">🚀 APP RELEASE</div>

    <div class="ver-card">
      <div class="vlabel">Current Version</div>
      <div class="vnum" id="appVer">v0.0.0</div>
      <div class="vmeta">
        <div class="chip" id="branchChip">📌 main</div>
        <div class="chip chip-green" id="statusChip">✓ Clean</div>
      </div>
    </div>

    <div class="btns">
      <button class="btn btn-prim" onclick="deployApp('patch')">
        <span class="bico">🐛</span><span class="btxt">Patch Release</span><span class="bsub">0.0.X</span>
      </button>
      <button class="btn btn-sec" onclick="deployApp('minor')">
        <span class="bico">✨</span><span class="btxt">Minor Release</span><span class="bsub">0.X.0</span>
      </button>
      <button class="btn btn-sec" onclick="deployApp('major')">
        <span class="bico">🚀</span><span class="btxt">Major Release</span><span class="bsub">X.0.0</span>
      </button>
    </div>

    <div class="divider"></div>
    <div class="ptitle" style="margin-bottom:8px;">직접 버전 지정</div>
    <div class="custom-ver">
      <input class="ver-input" id="customVer" placeholder="예: 2.3.0">
      <button class="btn btn-cyan" style="width:auto;padding:10px 16px;" onclick="deployCustom()">배포</button>
    </div>

    <div class="divider"></div>
    <div class="ptitle" style="margin-bottom:8px;">기타 작업</div>
    <div class="btns">
      <button class="btn btn-sec" onclick="gitPull()">
        <span class="bico">⬇</span><span class="btxt">Git Pull (최신 코드 받기)</span>
      </button>
      <button class="btn btn-red" onclick="gitRollback()">
        <span class="bico">↩</span><span class="btxt">Rollback (최근 커밋 취소)</span>
      </button>
    </div>
  </div>

  <!-- 오른쪽: 익스텐션 관리 -->
  <div class="panel">
    <div class="ptitle" style="justify-content:space-between;">
      <span>🧩 EXTENSIONS (GitHub 원격 상태)</span>
      <button class="cbtn" onclick="openAddExtModal()" style="border-color:var(--accent);color:var(--accent-lite);">➕ 추가</button>
    </div>
    <div id="extList">
      <div style="color:var(--dim);text-align:center;padding:40px;">로딩 중...</div>
    </div>
  </div>
</div>

<!-- 콘솔 -->
<div class="console-wrap">
  <div class="console-bar">
    <div class="console-title">⬛ CONSOLE <span id="logCount" style="color:var(--accent-lite);">0 lines</span></div>
    <div class="console-acts">
      <button class="cbtn" onclick="clearLog()">Clear</button>
      <button class="cbtn" onclick="copyLog()">Copy</button>
    </div>
  </div>
  <div class="console-log" id="consoleLog">
    <div class="log-line log-info">▶ XPIDER Deploy Center ready.</div>
  </div>
</div>

<script>
const $  = id => document.getElementById(id);
const logEl = $('consoleLog');
let logs = [];
let isBusy = false;

// ── 로그 ────────────────────────────────────────────
function addLog(text, err=false) {
  const d = document.createElement('div');
  d.className = 'log-line ' + (
    err ? 'log-err' :
    text.startsWith('>') ? 'log-cmd' :
    text.includes('✅') || text.includes('Exit: 0') ? 'log-ok' :
    text.startsWith('📦') || text.startsWith('📋') ? 'log-info' : ''
  );
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  logs.push(text);
  $('logCount').textContent = logs.length + ' lines';
}
function clearLog()  { logEl.innerHTML=''; logs=[]; $('logCount').textContent='0 lines'; }
function copyLog()   { navigator.clipboard.writeText(logs.join('\n')); }

// ── 상태 ────────────────────────────────────────────
function setStatus(busy, label='') {
  isBusy = busy;
  $('sdot').className = 'sdot' + (busy ? ' busy' : '');
  $('stext').textContent = busy ? (label || '배포 중...') : '준비됨';
  document.querySelectorAll('.btn').forEach(b => b.disabled = busy);
}

// ── SSE 연결 ────────────────────────────────────────
const es = new EventSource('/events');
es.onmessage = e => {
  const { type, payload } = JSON.parse(e.data);
  if (type === 'log')     addLog(payload.text, payload.err);
  if (type === 'status')  setStatus(payload === 'deploying');
  if (type === 'refresh') renderInfo(payload);
};

// ── 정보 로드 ────────────────────────────────────────
async function loadInfo() {
  const info = await fetch('/api/info').then(r=>r.json());
  renderInfo(info);
}

let globalExtensions = [];

function renderInfo(info) {
  globalExtensions = info.extensions;
  $('appVer').textContent = `v${info.appVersion}`;
  $('branchChip').textContent = `📌 ${info.branch}`;
  $('statusChip').className = 'chip ' + (info.dirty > 0 ? 'chip-red' : 'chip-green');
  $('statusChip').textContent = info.dirty > 0 ? `⚠ ${info.dirty} changes` : '✓ Clean';

  const el = $('extList');
  if (!info.extensions.length) {
    el.innerHTML = '<div style="color:var(--dim);text-align:center;padding:40px;">extensions/ 폴더가 비어 있습니다.</div>';
    return;
  }
  el.innerHTML = '';
  info.extensions.forEach(ext => {
    const card = document.createElement('div');
    card.className = 'ext-card';
    card.innerHTML = `
      <div class="ext-head">
        <span class="ext-name">${ext.name}</span>
        <div>
          <span class="ext-ver" style="margin-right:5px;">v${ext.version}</span>
          <button class="cbtn" title="편집" onclick="editExt('${ext.name}')">✏️</button>
          <button class="cbtn" title="삭제" style="color:var(--red);border-color:var(--red);" onclick="deleteExt('${ext.name}')">🗑️</button>
        </div>
      </div>
      <div class="ext-row">
        <input class="ext-inp" id="inp-${ext.name}" value="${bumpPatch(ext.version)}" placeholder="새 버전">
        <div class="ext-actions">
          <button class="btn btn-cyan" onclick="syncExt('${ext.name}')">⬇ Sync</button>
          <button class="btn btn-prim" onclick="deployExt('${ext.name}')">🚀 Deploy</button>
        </div>
      </div>`;
    el.appendChild(card);
  });
}

function bumpPatch(ver) {
  const [M,m,p] = ver.split('.').map(Number);
  return `${M}.${m}.${p+1}`;
}

// ── API 호출 ────────────────────────────────────────
async function post(path, body) {
  try {
    const res = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (!res.ok) {
      const data = await res.json().catch(()=>({}));
      if (data.error) alert(data.error);
      else alert('서버 처리 중 오류가 발생했습니다.');
      setStatus(false); // 로딩 해제
    }
    return res;
  } catch(e) {
    alert('네트워크 오류가 발생했습니다.');
    setStatus(false);
  }
}

function deployApp(type) {
  if (isBusy) return;
  if (!confirm(`${type.toUpperCase()} 배포를 시작합니까?`)) return;
  addLog(`\n── App Deploy (${type}) ──`, false);
  post('/api/deploy-app', { type });
}

function deployCustom() {
  const ver = $('customVer').value.trim();
  if (!ver.match(/^\d+\.\d+\.\d+$/)) { alert('올바른 버전 형식을 입력하세요. 예: 2.3.0'); return; }
  if (!confirm(`v${ver} 으로 배포합니까?`)) return;
  addLog(`\n── App Deploy (custom: ${ver}) ──`, false);
  post('/api/deploy-app', { type: ver });
}

function deployExt(name) {
  if (isBusy) return;
  const ver = document.getElementById(`inp-${name}`).value.trim();
  if (!ver.match(/^\d+\.\d+\.\d+$/)) { alert('올바른 버전을 입력하세요.'); return; }
  if (!confirm(`${name} → v${ver} 배포합니까?`)) return;
  addLog(`\n── Extension Deploy: ${name} v${ver} ──`, false);
  post('/api/deploy-ext', { name, version: ver });
}

function syncExt(name) {
  if (isBusy) return;
  addLog(`\n── Extension Sync: ${name} ──`, false);
  post('/api/sync-ext', { name });
}

function gitPull() {
  if (isBusy) return;
  addLog('\n── Git Pull ──', false);
  post('/api/deploy-app', { type: '__pull__' });  // 서버에서 처리
}

function gitRollback() {
  if (isBusy) return;
  if (!confirm('⚠ 마지막 커밋을 취소합니다. 계속할까요?')) return;
  addLog('\n── Git Rollback ──', false);
  post('/api/deploy-app', { type: '__rollback__' });
}

function editExt(oldName) {
  if (isBusy) return;
  const ext = globalExtensions.find(e => e.name === oldName);
  const newName = prompt(`익스텐션의 새로운 이름을 입력하세요.`, oldName);
  if (!newName) return;
  const newSource = prompt(`새 원본 소스 경로를 입력하세요.\n(없으면 빈칸)`, ext ? ext.sourcePath : '');
  
  if (!confirm(`'${oldName}' 정보를 수정하시겠습니까?`)) return;
  
  addLog(`\n── Edit Extension: ${oldName} -> ${newName} ──`, false);
  post('/api/edit-ext', { oldName, newName, sourcePath: newSource || '' });
}

function deleteExt(name) {
  if (isBusy) return;
  if (!confirm(`정말로 '${name}' 익스텐션을 삭제하시겠습니까?\n이 작업은 로컬과 GitHub 모두에서 삭제되며 되돌릴 수 없습니다!`)) return;
  
  addLog(`\n── Delete Extension: ${name} ──`, false);
  post('/api/delete-ext', { name });
}

function openAddExtModal() {
  if (isBusy) return;
  const name = prompt("새로운 익스텐션의 이름(영문 폴더명)을 입력하세요.\n예: my-new-extension");
  if (!name) return;
  const sourcePath = prompt(`'${name}'의 원본 소스 코드가 있는 전체 경로를 입력하세요.\n(빈칸으로 두면 빈 익스텐션이 생성됩니다)\n예: e:/vivpr/ai/my-ext`);
  
  if (!confirm(`'${name}' 익스텐션을 새로 등록하시겠습니까?`)) return;
  
  addLog(`\n── Add New Extension: ${name} ──`, false);
  post('/api/add-ext', { name, sourcePath: sourcePath || '' });
}

function openActions() {
  const url = 'https://github.com/goodkie/xpider-browser/actions';
  const features = 'width=1200,height=800,menubar=no,toolbar=no,location=yes,status=no,resizable=yes,scrollbars=yes';
  window.open(url, 'XPIDER_ACTIONS', features);
}


loadInfo();
</script>
</body>
</html>
