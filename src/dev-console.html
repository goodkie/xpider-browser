<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XPIDER DevConsole // DEVELOPER ONLY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg-main:    #080c10;
    --bg-panel:   rgba(10,18,28,0.96);
    --bg-card:    rgba(16,28,42,0.85);
    --bg-input:   rgba(0,20,40,0.7);
    --border:     rgba(0,200,120,0.18);
    --border-hi:  rgba(0,255,150,0.45);
    --green:      #00ff88;
    --green-dim:  #00aa55;
    --green-glow: rgba(0,255,136,0.25);
    --yellow:     #ffdd44;
    --red:        #ff4455;
    --blue:       #44aaff;
    --orange:     #ff8844;
    --purple:     #aa77ff;
    --cyan:       #00ddff;
    --text:       #c8f0d8;
    --text-dim:   #5a8a6a;
    --font-mono:  'JetBrains Mono', 'Courier New', monospace;
    --font-ui:    'Inter', system-ui, sans-serif;
    --toolbar-h:  52px;
    --statusbar-h: 26px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-main);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    overflow: hidden;
    user-select: none;
  }

  /* ── 스캔라인 오버레이 ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,255,100,0.012) 2px,
      rgba(0,255,100,0.012) 4px
    );
  }

  /* ── 툴바 ── */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--toolbar-h);
    background: linear-gradient(180deg, rgba(0,30,20,0.98) 0%, rgba(5,18,12,0.95) 100%);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,255,100,0.08);
    -webkit-app-region: drag;
  }

  #toolbar > * { -webkit-app-region: no-drag; }

  .toolbar-logo {
    display: flex; align-items: center; gap: 8px;
    margin-right: 8px;
  }

  .logo-icon {
    width: 24px; height: 24px;
    background: var(--green);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #000;
    font-family: var(--font-ui);
    box-shadow: 0 0 12px var(--green-glow);
    cursor: pointer;
    transition: box-shadow 0.2s;
  }
  .logo-icon:hover { box-shadow: 0 0 20px var(--green); }

  .toolbar-title {
    font-family: var(--font-ui);
    font-size: 11px; font-weight: 600;
    color: var(--green-dim);
    letter-spacing: 2px; text-transform: uppercase;
  }

  .toolbar-sep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }

  /* ── 라이브 지시등 ── */
  #live-indicator {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--green); letter-spacing: 1px;
    font-family: var(--font-ui);
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  /* ── 레벨 필터 버튼들 ── */
  .level-btns { display: flex; gap: 4px; }
  .lvl-btn {
    padding: 3px 9px; border-radius: 4px; border: 1px solid transparent;
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--bg-card);
  }
  .lvl-btn[data-level="ALL"]    { border-color: var(--border); color: var(--text-dim); }
  .lvl-btn[data-level="INFO"]   { border-color: rgba(0,200,120,0.3); color: var(--green-dim); }
  .lvl-btn[data-level="WARN"]   { border-color: rgba(255,220,60,0.3); color: var(--yellow); }
  .lvl-btn[data-level="ERROR"]  { border-color: rgba(255,60,80,0.3); color: var(--red); }
  .lvl-btn[data-level="ENGINE"] { border-color: rgba(68,170,255,0.3); color: var(--blue); }
  .lvl-btn[data-level="TAB"]    { border-color: rgba(0,220,255,0.3); color: var(--cyan); }
  .lvl-btn[data-level="NET"]    { border-color: rgba(170,119,255,0.3); color: var(--purple); }
  .lvl-btn[data-level="EXT"]    { border-color: rgba(255,136,68,0.3); color: var(--orange); }
  .lvl-btn[data-level="IPC"]    { border-color: rgba(100,200,100,0.3); color: #88ff88; }
  .lvl-btn.active {
    background: rgba(0,255,136,0.1);
    border-color: var(--green) !important;
    color: var(--green) !important;
    box-shadow: 0 0 8px rgba(0,255,136,0.2);
  }
  .lvl-btn[data-level="WARN"].active  { background: rgba(255,220,60,0.1); border-color: var(--yellow) !important; color: var(--yellow) !important; }
  .lvl-btn[data-level="ERROR"].active { background: rgba(255,60,80,0.1); border-color: var(--red) !important; color: var(--red) !important; }
  .lvl-btn[data-level="ENGINE"].active{ background: rgba(68,170,255,0.1); border-color: var(--blue) !important; color: var(--blue) !important; }
  .lvl-btn[data-level="TAB"].active   { background: rgba(0,220,255,0.1); border-color: var(--cyan) !important; color: var(--cyan) !important; }
  .lvl-btn[data-level="NET"].active   { background: rgba(170,119,255,0.1); border-color: var(--purple) !important; color: var(--purple) !important; }
  .lvl-btn[data-level="EXT"].active   { background: rgba(255,136,68,0.1); border-color: var(--orange) !important; color: var(--orange) !important; }
  .lvl-btn[data-level="IPC"].active   { background: rgba(100,200,100,0.1); border-color: #88ff88 !important; color: #88ff88 !important; }

  /* ── 검색창 ── */
  #search-wrap {
    flex: 1; max-width: 280px; position: relative;
  }
  #search-input {
    width: 100%; padding: 5px 10px 5px 28px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 5px; color: var(--text); font-family: var(--font-mono);
    font-size: 11px; outline: none; transition: border-color 0.2s;
  }
  #search-input:focus { border-color: var(--border-hi); }
  #search-input::placeholder { color: var(--text-dim); }
  .search-icon {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    color: var(--text-dim); font-size: 11px; pointer-events: none;
  }

  /* ── 우측 액션 버튼들 ── */
  .action-btns { display: flex; gap: 6px; margin-left: auto; }
  .action-btn {
    padding: 4px 10px; border-radius: 4px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-dim); font-family: var(--font-ui); font-size: 10px;
    font-weight: 500; cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase;
    transition: all 0.15s;
  }
  .action-btn:hover { border-color: var(--green); color: var(--green); background: rgba(0,255,136,0.07); }
  .action-btn.danger:hover { border-color: var(--red); color: var(--red); background: rgba(255,60,80,0.07); }
  .action-btn.close-btn:hover { border-color: var(--red); color: var(--red); }

  /* ── 소스 필터 드롭다운 ── */
  #source-filter {
    padding: 4px 8px; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text-dim); font-family: var(--font-mono);
    font-size: 10px; outline: none; cursor: pointer;
  }
  #source-filter:focus { border-color: var(--border-hi); }

  /* ── 자동 스크롤 토글 ── */
  .toggle-wrap { display: flex; align-items: center; gap: 5px; }
  .toggle-label { font-family: var(--font-ui); font-size: 10px; color: var(--text-dim); }
  .toggle {
    width: 28px; height: 15px; background: var(--bg-input); border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; position: relative; transition: background 0.2s;
  }
  .toggle.on { background: rgba(0,200,100,0.3); border-color: var(--green-dim); }
  .toggle::after {
    content: ''; position: absolute; top: 1px; left: 1px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--text-dim); transition: all 0.2s;
  }
  .toggle.on::after { left: 14px; background: var(--green); box-shadow: 0 0 6px var(--green); }

  /* ── 카운터 ── */
  #log-counter {
    font-family: var(--font-ui); font-size: 10px; color: var(--text-dim);
    white-space: nowrap;
  }

  /* ── 로그 뷰어 ── */
  #log-container {
    position: fixed;
    top: var(--toolbar-h);
    left: 0; right: 0;
    bottom: var(--statusbar-h);
    overflow-y: auto;
    padding: 6px 0;
  }

  /* 스크롤바 */
  #log-container::-webkit-scrollbar { width: 6px; }
  #log-container::-webkit-scrollbar-track { background: transparent; }
  #log-container::-webkit-scrollbar-thumb { background: rgba(0,200,100,0.2); border-radius: 3px; }
  #log-container::-webkit-scrollbar-thumb:hover { background: rgba(0,200,100,0.4); }

  /* ── 로그 행 ── */
  .log-row {
    display: flex; align-items: flex-start; gap: 0;
    padding: 1px 10px;
    border-bottom: 1px solid transparent;
    transition: background 0.1s;
    font-size: 11.5px; line-height: 1.55;
  }
  .log-row:hover { background: rgba(0,255,100,0.04); border-bottom-color: rgba(0,255,100,0.06); }
  .log-row.level-ERROR { background: rgba(255,40,60,0.06); }
  .log-row.level-ERROR:hover { background: rgba(255,40,60,0.1); }
  .log-row.level-WARN  { background: rgba(255,200,40,0.04); }

  .log-seq {
    color: rgba(0,150,80,0.4); min-width: 52px; font-size: 10px;
    padding-right: 6px; margin-top: 1px; flex-shrink: 0;
  }
  .log-ts {
    color: rgba(0,200,100,0.35); min-width: 86px; font-size: 10px;
    padding-right: 8px; margin-top: 1px; flex-shrink: 0;
  }
  .ts-hidden .log-ts { display: none; }

  .log-level {
    font-weight: 700; min-width: 56px; font-size: 10px;
    padding-right: 6px; margin-top: 1px; flex-shrink: 0; text-align: center;
  }
  .lvl-INFO   { color: var(--green-dim); }
  .lvl-WARN   { color: var(--yellow); }
  .lvl-ERROR  { color: var(--red); text-shadow: 0 0 8px rgba(255,60,80,0.5); }
  .lvl-DEBUG  { color: var(--text-dim); }
  .lvl-ENGINE { color: var(--blue); }
  .lvl-TAB    { color: var(--cyan); }
  .lvl-NET    { color: var(--purple); }
  .lvl-EXT    { color: var(--orange); }
  .lvl-IPC    { color: #88ff88; }

  .log-source {
    color: rgba(100,200,180,0.55); min-width: 160px; max-width: 200px;
    font-size: 10px; padding-right: 10px; margin-top: 1px; flex-shrink: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .log-msg {
    color: var(--text); flex: 1; word-break: break-all; white-space: pre-wrap;
    font-size: 11.5px;
  }
  .log-msg mark {
    background: rgba(255,220,0,0.3); color: var(--yellow);
    border-radius: 2px; padding: 0 1px;
  }
  .log-extra {
    color: var(--text-dim); font-size: 10px; margin-left: 8px;
    background: rgba(0,0,0,0.2); padding: 1px 5px; border-radius: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px;
  }

  /* ── 상태바 ── */
  #statusbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--statusbar-h);
    background: rgba(0,20,12,0.97);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    padding: 0 12px;
    font-family: var(--font-ui); font-size: 10px; color: var(--text-dim);
  }
  #statusbar .sb-item { display: flex; align-items: center; gap: 5px; }
  #statusbar .sb-val  { color: var(--green-dim); font-family: var(--font-mono); }
  #log-path-display { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 빈 상태 ── */
  #empty-state {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: var(--text-dim);
    display: none; flex-direction: column; align-items: center; gap: 10px;
  }
  #empty-state.visible { display: flex; }
  .empty-icon { font-size: 36px; opacity: 0.3; }
  .empty-text { font-family: var(--font-ui); font-size: 13px; }

  /* ── 헤더 행 ── */
  .log-header-row {
    display: flex; align-items: center; gap: 0;
    padding: 3px 10px 4px;
    border-bottom: 1px solid rgba(0,200,100,0.15);
    font-size: 9px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.8px; background: rgba(0,30,18,0.6);
    position: sticky; top: 0; z-index: 10;
  }
  .log-header-row .col-seq    { min-width: 52px; padding-right: 6px; }
  .log-header-row .col-ts     { min-width: 86px; padding-right: 8px; }
  .log-header-row .col-level  { min-width: 56px; padding-right: 6px; }
  .log-header-row .col-source { min-width: 160px; max-width: 200px; padding-right: 10px; }
  .log-header-row .col-msg    { flex: 1; }
</style>
</head>
<body>

<!-- ── 툴바 ──────────────────────────────────────────────────────────── -->
<div id="toolbar">
  <div class="toolbar-logo">
    <div class="logo-icon" title="XPIDER DevConsole">X</div>
    <span class="toolbar-title">DevConsole</span>
  </div>

  <div class="toolbar-sep"></div>

  <div id="live-indicator">
    <div class="live-dot"></div>
    <span>LIVE</span>
  </div>

  <div class="toolbar-sep"></div>

  <!-- 레벨 필터 -->
  <div class="level-btns" id="level-btns">
    <button class="lvl-btn active" data-level="ALL">ALL</button>
    <button class="lvl-btn" data-level="INFO">Info</button>
    <button class="lvl-btn" data-level="WARN">Warn</button>
    <button class="lvl-btn" data-level="ERROR">Error</button>
    <button class="lvl-btn" data-level="ENGINE">Engine</button>
    <button class="lvl-btn" data-level="TAB">Tab</button>
    <button class="lvl-btn" data-level="NET">Net</button>
    <button class="lvl-btn" data-level="EXT">Ext</button>
    <button class="lvl-btn" data-level="IPC">IPC</button>
  </div>

  <div class="toolbar-sep"></div>

  <!-- 소스 필터 -->
  <select id="source-filter">
    <option value="ALL">모든 소스</option>
    <option value="Main">Main</option>
    <option value="CampaignEngine">CampaignEngine</option>
    <option value="Tab">Tab</option>
    <option value="Net">Net</option>
    <option value="Ext[AutoForm">AutoForm Sender</option>
    <option value="Ext[GoogleMaps">Google Maps</option>
    <option value="Ext[LocalBiz">LocalBiz Crawler</option>
    <option value="Ext[Email">Email Extractor</option>
    <option value="DevLog">DevLog</option>
  </select>

  <!-- 검색 -->
  <div id="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="키워드 검색..." autocomplete="off" spellcheck="false">
  </div>

  <!-- 자동 스크롤 -->
  <div class="toggle-wrap">
    <span class="toggle-label">AUTO SCROLL</span>
    <div class="toggle on" id="auto-scroll-toggle"></div>
  </div>

  <!-- 타임스탬프 토글 -->
  <div class="toggle-wrap">
    <span class="toggle-label">TIMESTAMP</span>
    <div class="toggle on" id="ts-toggle"></div>
  </div>

  <div id="log-counter">0 logs</div>

  <!-- 액션 버튼들 -->
  <div class="action-btns">
    <button class="action-btn" id="btn-export-clipboard">📋 Copy</button>
    <button class="action-btn" id="btn-open-file">📁 Open File</button>
    <button class="action-btn danger" id="btn-clear">🗑 Clear</button>
    <button class="action-btn close-btn" id="btn-close">✕ Close</button>
  </div>
</div>

<!-- ── 로그 컨테이너 ──────────────────────────────────────────────────── -->
<div id="log-container">
  <!-- 헤더 행 -->
  <div class="log-header-row">
    <div class="col-seq">#</div>
    <div class="col-ts">Timestamp</div>
    <div class="col-level">Level</div>
    <div class="col-source">Source</div>
    <div class="col-msg">Message</div>
  </div>

  <div id="log-list"></div>

  <div id="empty-state" class="visible">
    <div class="empty-icon">📡</div>
    <div class="empty-text">로그 수신 대기 중...</div>
    <div style="font-size:10px;opacity:0.6;">XPIDER가 동작하면 로그가 실시간으로 표시됩니다</div>
  </div>
</div>

<!-- ── 상태바 ─────────────────────────────────────────────────────────── -->
<div id="statusbar">
  <div class="sb-item">버퍼: <span class="sb-val" id="sb-count">0</span>건</div>
  <div class="sb-item">표시: <span class="sb-val" id="sb-visible">0</span>건</div>
  <div class="sb-item">에러: <span class="sb-val" style="color:var(--red)" id="sb-errors">0</span></div>
  <div class="sb-item">경고: <span class="sb-val" style="color:var(--yellow)" id="sb-warns">0</span></div>
  <div id="log-path-display">로그 파일 경로 로딩 중...</div>
</div>

<script>
/* ── 상태 ──────────────────────────────────────────────────────── */
const api = window.devConsoleAPI;
let allLogs      = [];      // 전체 인메모리 로그
let filteredLogs = [];      // 현재 필터 결과
let activeLevel  = 'ALL';
let activeSource = 'ALL';
let keyword      = '';
let autoScroll   = true;
let showTs       = true;
let errorCount   = 0;
let warnCount    = 0;

/* ── DOM 요소 ──────────────────────────────────────────────────── */
const $list       = document.getElementById('log-list');
const $container  = document.getElementById('log-container');
const $empty      = document.getElementById('empty-state');
const $counter    = document.getElementById('log-counter');
const $sbCount    = document.getElementById('sb-count');
const $sbVisible  = document.getElementById('sb-visible');
const $sbErrors   = document.getElementById('sb-errors');
const $sbWarns    = document.getElementById('sb-warns');
const $pathDisp   = document.getElementById('log-path-display');
const $search     = document.getElementById('search-input');
const $srcFilter  = document.getElementById('source-filter');
const $autoScroll = document.getElementById('auto-scroll-toggle');
const $tsToggle   = document.getElementById('ts-toggle');

/* ── 로그 레코드 → DOM 행 변환 ─────────────────────────────────── */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightKw(text, kw) {
  if (!kw) return escHtml(text);
  const safeKw = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escHtml(text).replace(new RegExp(safeKw, 'gi'), m => `<mark>${m}</mark>`);
}

function levelClass(lvl) {
  const map = { INFO:'lvl-INFO', WARN:'lvl-WARN', ERROR:'lvl-ERROR', DEBUG:'lvl-DEBUG',
                ENGINE:'lvl-ENGINE', TAB:'lvl-TAB', NET:'lvl-NET', EXT:'lvl-EXT', IPC:'lvl-IPC' };
  return map[lvl] || 'lvl-INFO';
}

function formatTs(isoStr) {
  try {
    const d = new Date(isoStr);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
  } catch { return isoStr; }
}

function buildRow(rec) {
  const row = document.createElement('div');
  row.className = `log-row level-${rec.level}`;
  row.dataset.level  = rec.level;
  row.dataset.source = rec.source;

  const extraStr = rec.extra ? (' ' + JSON.stringify(rec.extra)).substring(0, 200) : '';

  row.innerHTML = `
    <span class="log-seq">${rec.seq}</span>
    <span class="log-ts">${formatTs(rec.ts)}</span>
    <span class="log-level ${levelClass(rec.level)}">[${rec.level}]</span>
    <span class="log-source" title="${escHtml(rec.source)}">${escHtml(rec.source)}</span>
    <span class="log-msg">${highlightKw(rec.msg, keyword)}${extraStr ? `<span class="log-extra">${escHtml(extraStr)}</span>` : ''}</span>
  `;
  return row;
}

/* ── 필터 적용 ─────────────────────────────────────────────────── */
function applyFilters() {
  filteredLogs = allLogs.filter(r => {
    if (activeLevel !== 'ALL' && r.level !== activeLevel) return false;
    if (activeSource !== 'ALL' && !r.source.includes(activeSource)) return false;
    if (keyword && !r.msg.toLowerCase().includes(keyword.toLowerCase())) return false;
    return true;
  });
  renderAll();
}

function renderAll() {
  $list.innerHTML = '';
  const frag = document.createDocumentFragment();
  filteredLogs.forEach(r => frag.appendChild(buildRow(r)));
  $list.appendChild(frag);
  updateStats();
  if (autoScroll) $container.scrollTop = $container.scrollHeight;
  $empty.classList.toggle('visible', filteredLogs.length === 0);
  if (!showTs) $container.classList.add('ts-hidden');
  else $container.classList.remove('ts-hidden');
}

/* ── 단일 레코드 추가 ────────────────────────────────────────────── */
function appendRecord(rec) {
  allLogs.push(rec);
  if (rec.level === 'ERROR') errorCount++;
  if (rec.level === 'WARN')  warnCount++;

  // 필터 통과 여부 확인
  if (activeLevel !== 'ALL' && rec.level !== activeLevel) { updateStats(); return; }
  if (activeSource !== 'ALL' && !rec.source.includes(activeSource)) { updateStats(); return; }
  if (keyword && !rec.msg.toLowerCase().includes(keyword.toLowerCase())) { updateStats(); return; }

  filteredLogs.push(rec);
  const row = buildRow(rec);
  $list.appendChild(row);
  if (!showTs) $container.classList.add('ts-hidden');

  updateStats();
  if (autoScroll) {
    // rAF으로 스크롤 최적화
    requestAnimationFrame(() => { $container.scrollTop = $container.scrollHeight; });
  }
  $empty.classList.remove('visible');
}

/* ── 통계 업데이트 ───────────────────────────────────────────────── */
function updateStats() {
  $counter.textContent = `${allLogs.length.toLocaleString()} logs`;
  $sbCount.textContent   = allLogs.length.toLocaleString();
  $sbVisible.textContent = filteredLogs.length.toLocaleString();
  $sbErrors.textContent  = errorCount;
  $sbWarns.textContent   = warnCount;
}

/* ── 레벨 버튼 클릭 ──────────────────────────────────────────────── */
document.getElementById('level-btns').addEventListener('click', (e) => {
  const btn = e.target.closest('.lvl-btn');
  if (!btn) return;
  document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeLevel = btn.dataset.level;
  applyFilters();
});

/* ── 소스 필터 변경 ──────────────────────────────────────────────── */
$srcFilter.addEventListener('change', () => {
  activeSource = $srcFilter.value;
  applyFilters();
});

/* ── 검색 ────────────────────────────────────────────────────────── */
let searchTimer;
$search.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    keyword = $search.value.trim();
    applyFilters();
  }, 200);
});

/* ── 자동 스크롤 토글 ────────────────────────────────────────────── */
$autoScroll.addEventListener('click', () => {
  autoScroll = !autoScroll;
  $autoScroll.classList.toggle('on', autoScroll);
});

/* ── 타임스탬프 토글 ─────────────────────────────────────────────── */
$tsToggle.addEventListener('click', () => {
  showTs = !showTs;
  $tsToggle.classList.toggle('on', showTs);
  $container.classList.toggle('ts-hidden', !showTs);
});

/* ── 클립보드 복사 ───────────────────────────────────────────────── */
document.getElementById('btn-export-clipboard').addEventListener('click', () => {
  const text = filteredLogs.map(r =>
    `[${r.seq}] ${r.ts} [${r.level}] ${r.source} — ${r.msg}${r.extra ? ' ' + JSON.stringify(r.extra) : ''}`
  ).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-export-clipboard');
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
  });
});

/* ── 파일 열기 ───────────────────────────────────────────────────── */
document.getElementById('btn-open-file').addEventListener('click', () => {
  api.openLogFile();
});

/* ── 로그 초기화 ─────────────────────────────────────────────────── */
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('모든 로그를 지우겠습니까?')) return;
  api.clearLogs().then(() => {
    allLogs = []; filteredLogs = [];
    errorCount = 0; warnCount = 0;
    $list.innerHTML = '';
    updateStats();
    $empty.classList.add('visible');
  });
});

/* ── 창 닫기 ─────────────────────────────────────────────────────── */
document.getElementById('btn-close').addEventListener('click', () => {
  api.closeConsole();
});

/* ── IPC 이벤트 수신 ─────────────────────────────────────────────── */

// 초기 스냅샷 수신
api.onSnapshot((logs) => {
  allLogs = logs;
  errorCount = logs.filter(r => r.level === 'ERROR').length;
  warnCount  = logs.filter(r => r.level === 'WARN').length;
  applyFilters();
});

// 실시간 레코드 스트림
api.onRecord((rec) => {
  appendRecord(rec);
});

/* ── 로그 파일 경로 표시 ──────────────────────────────────────────── */
api.getLogPath().then(p => {
  $pathDisp.textContent = p ? `📄 ${p}` : '로그 파일 경로 없음';
  $pathDisp.title = p || '';
});

</script>
</body>
</html>
